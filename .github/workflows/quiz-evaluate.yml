name: PR Balrog — Evaluate Answers

on:
  issue_comment:
    types: [created, edited]

permissions:
  checks: write
  pull-requests: write
  contents: read
  actions: write # read: artifact lookup, write: workflow_dispatch for !balrog retry

jobs:
  evaluate-quiz:
    name: Evaluate Quiz Answers
    runs-on: ubuntu-latest
    if: >
      (github.event.action == 'created' && startsWith(github.event.comment.body, '!balrog')) ||
      github.event.action == 'edited'

    steps:
      - name: Checkout action
        uses: actions/checkout@v4
        with:
          repository: oncleguigs/pr-balrog
          ref: main
          path: .balrog

      - name: Evaluate answers
        uses: ./.balrog/evaluate
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: "auto"
